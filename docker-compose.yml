# ============================================================
# docker-compose.yml — RPC 框架开发 & 测试环境
# ============================================================
# 用法：
#   docker compose up build     — 一键编译（Release + ASan）
#   docker compose up test      — 运行全部测试
#   docker compose up benchmark — 跑性能基准
#   docker compose up dev       — 进入交互式开发容器
#   docker compose up shell     — 进入 runtime 容器检查产物
# ============================================================

services:
  # -------- 编译服务 --------
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: rpc-framework:builder
    volumes:
      - .:/rpc          # 挂载源码，支持增量编译
    working_dir: /rpc
    command: >
      bash -c "
        echo '=== Release Build ===' &&
        cmake -B build-release -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 &&
        cmake --build build-release -j$$(nproc) &&
        echo '=== ASan Build ===' &&
        cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          -DENABLE_ASAN=ON -DENABLE_UBSAN=ON &&
        cmake --build build-asan -j$$(nproc) &&
        echo '=== Build Complete ==='
      "

  # -------- 测试服务 --------
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: rpc-framework:builder
    volumes:
      - .:/rpc
    working_dir: /rpc
    command: >
      bash -c "
        echo '=== Release Tests ===' &&
        cd build-release && ctest --output-on-failure &&
        echo '=== ASan Tests ===' &&
        cd ../build-asan && ctest --output-on-failure &&
        echo '=== All Tests Passed ==='
      "
    depends_on:
      build:
        condition: service_completed_successfully

  # -------- Benchmark 服务 --------
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: rpc-framework:builder
    volumes:
      - .:/rpc
    working_dir: /rpc
    command: >
      bash -c "
        echo '=== Coroutine Benchmark ===' &&
        ./build-release/benchmark/bench_coroutine &&
        echo '=== Serializer Benchmark ===' &&
        ./build-release/benchmark/bench_serializer &&
        echo '=== Buffer Benchmark ===' &&
        ./build-release/benchmark/bench_buffer &&
        echo '=== RPC Lookup Benchmark ===' &&
        ./build-release/benchmark/bench_rpc_lookup
      "
    depends_on:
      build:
        condition: service_completed_successfully

  # -------- 交互式开发容器 --------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: rpc-framework:builder
    volumes:
      - .:/rpc
    working_dir: /rpc
    stdin_open: true
    tty: true
    command: bash

  # -------- Runtime 精简容器 --------
  shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rpc-framework:runtime
    stdin_open: true
    tty: true
    command: bash
